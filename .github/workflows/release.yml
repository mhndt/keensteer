name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Check version
        run: |
          header_version=$(sed -n 's/^#define KS_VERSION "\([^"]*\)"/\1/p' include/keensteer.h)
          make_version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' Makefile)
          test "$header_version" = "$make_version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$header_version" = "$GITHUB_REF_NAME"
          fi
      - run: make test
      - name: Check shell scripts
        run: |
          for script in install.sh uninstall.sh files/S99keensteer files/keensteer-setup tests/test-setup.sh; do
            dash -n "$script"
          done

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mips-3.4
            release_arch: mips
            machine: MIPS
            data: big endian
            loader: /opt/lib/ld.so.1
          - arch: mipsel-3.4
            release_arch: mipsel
            machine: MIPS
            data: little endian
            loader: /opt/lib/ld.so.1
          - arch: aarch64-3.10
            release_arch: aarch64
            machine: AArch64
            data: little endian
            loader: /opt/lib/ld-linux-aarch64.so.1
    container:
      image: waujito/entware_builder:${{ matrix.arch }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.arch }} release
        working-directory: /home/me/Entware
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          MACHINE: ${{ matrix.machine }}
          DATA: ${{ matrix.data }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          src=$GITHUB_WORKSPACE
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' "$src/Makefile")
          test -n "$version"

          mkdir -p package/keensteer
          cat > package/keensteer/Makefile <<'MAKEFILE'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=keensteer
          PKG_VERSION:=$(KEENSTEER_VERSION)
          PKG_RELEASE:=1
          PKG_LICENSE:=GPL-3.0-only
          PKG_LICENSE_FILES:=LICENSE
          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)

          include $(INCLUDE_DIR)/package.mk

          define Package/keensteer
          	SECTION:=net
          	CATEGORY:=Network
          	TITLE:=Keenetic/OpenWrt roaming interoperability daemon
          	DEPENDS:=+libopenssl
          endef

          define Build/Prepare
          	rm -rf $(PKG_BUILD_DIR)
          	mkdir -p $(PKG_BUILD_DIR)
          	cp -a $(KEENSTEER_SRC)/. $(PKG_BUILD_DIR)/
          endef

          define Build/Compile
          	$(MAKE) -C $(PKG_BUILD_DIR) \
          		CC="$(TARGET_CC)" \
          		CPPFLAGS="$(TARGET_CPPFLAGS) -I$(STAGING_DIR)/opt/include -I$(PKG_BUILD_DIR)/include" \
          		CFLAGS="$(TARGET_CFLAGS)" \
          		LDFLAGS="$(TARGET_LDFLAGS) -L$(STAGING_DIR)/opt/lib"
          endef

          define Package/keensteer/install
          	$(INSTALL_DIR) $(1)/opt/sbin
          	$(INSTALL_BIN) $(PKG_BUILD_DIR)/keensteerd $(1)/opt/sbin/keensteerd
          endef

          $(eval $(call BuildPackage,keensteer))
          MAKEFILE

          printf '\nCONFIG_PACKAGE_keensteer=m\n' >> .config
          make defconfig KEENSTEER_VERSION="$version" KEENSTEER_SRC="$src"
          make -j"$(nproc)" package/keensteer/compile V=s \
            KEENSTEER_VERSION="$version" KEENSTEER_SRC="$src"

          binary=$(find build_dir -type f \
            -path '*/ipkg-*/keensteer/opt/sbin/keensteerd' -print -quit)
          test -n "$binary"

          readelf -h "$binary" | grep -q "Machine:.*$MACHINE"
          readelf -h "$binary" | grep -q "$DATA"
          readelf -l "$binary" | grep -q "$LOADER"
          readelf -d "$binary" | grep -q 'libcrypto.so.3'

          out="$src/dist/keensteer-$version"
          mkdir -p "$out"
          cp "$binary" "$out/keensteerd"
          cp "$src/install.sh" "$src/uninstall.sh" "$out/"
          cp -a "$src/files" "$out/"
          cp "$src/README.md" "$src/SETUP.md" "$src/PROTOCOL.md" "$src/LICENSE" "$out/"
          chmod 0755 "$out/keensteerd" "$out/install.sh" "$out/uninstall.sh" \
            "$out/files/S99keensteer" "$out/files/keensteer-setup"

          tar -C "$src/dist" -czf "$src/dist/keensteer-$version-$RELEASE_ARCH.tar.gz" \
            "keensteer-$version"
          rm -rf "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: keensteer-${{ github.ref_name }}-${{ matrix.release_arch }}
          path: dist/keensteer-*-${{ matrix.release_arch }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
