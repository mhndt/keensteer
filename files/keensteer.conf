interface=br0

usteer=1
usteer_interval=1000
# usteer_peer=192.168.1.2

ft=0
rrb_key_file=/opt/etc/keensteer.rrb.key

# bss=<ifname>,<node-name>,<ssid>,<bssid>,<channel>,<opclass>[,<r1kh-id>[,<r0kh-id>]]
bss=ra8,keenetic.5g,example-wifi,02:00:00:00:00:11,44,128,,keenetic-example-r0

